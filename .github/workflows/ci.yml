name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '27-ea'
          cache: 'maven'

      - name: Build Simple (parent POM)
        run: mvn install -DskipTests -N -q
        working-directory: lib/simple

      - name: Build Simple (chapter14)
        run: mvn install -DskipTests -q
        working-directory: lib/simple/chapter14

      - name: Build and test Nica
        run: mvn verify
